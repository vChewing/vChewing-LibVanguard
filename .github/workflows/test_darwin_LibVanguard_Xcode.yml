name: unit-test-LibVanguard-macOS-Xcode
on:
  workflow_dispatch: {}
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  build:
    name: test-macOS-LibVanguard-Xcode
    # Swift 6.4+ is required: 6.2 / 6.3 are blocked by the manifests
    # (`Package@swift-6.2.swift` / `Package@swift-6.3.swift`). Xcode 27.0 is the
    # first Xcode shipping Swift 6.4 (P216 §13.6). Older Xcode (26.6) ships 6.3.3.
    runs-on: xcode-27
    steps:
      - uses: actions/checkout@v4
        env:
          # Limit TLS verification override to this step only. Do NOT enable this
          # job-wide; we only apply it for checkout due to external host cert
          # issues.
          GIT_SSL_NO_VERIFY: true
      - name: Cache SPM build
        uses: actions/cache@v4
        with:
          # Dependency checkouts only. `.build` is deliberately not cached: a
          # restored build tree lets a release build reuse artefacts from an older
          # commit or another toolchain, which is exactly the failure mode this job
          # must not have. The sibling SwiftOpenSource job cleans for the same
          # reason; here the clean below is what guarantees it.
          path: |
            ~/.swiftpm
          key: ${{ runner.os }}-swift-${{ hashFiles('**/Package.resolved', 'Package.swift') }}
          restore-keys: |
            ${{ runner.os }}-swift-
      - name: Clean
        run: swift package clean
      - name: Test
        run: swift --version && swift test -c release
